name: Close pull requests

# Galta takes pull requests only from members of the Aha Labs organization
# (CONTRIBUTING.md). GitHub reports a membership only when it is public, so
# members keep theirs public. This runs on the base repository's definition and
# never checks out the pull request's code; a maintainer who reopens a pull
# request keeps it open.
on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  close:
    if: ${{ !contains(fromJSON('["OWNER", "MEMBER"]'), github.event.pull_request.author_association) }}
    runs-on: ubuntu-latest
    steps:
      - run: gh pr close "$NUMBER" --repo "$REPOSITORY" --comment "$MESSAGE"
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          MESSAGE: >-
            Thank you for taking the time. Galta accepts pull requests only from
            members of the Aha Labs organization, so this one is closed
            automatically; see CONTRIBUTING.md. If it fixes a bug or adds
            something you need, please open an issue describing the problem
            instead.
