<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Galta collector verification</title>
<style>
  /* A deliberately hostile host page.
     Every rule here is aimed at the collector: a global font and line-height
     that would inherit into the shadow tree unless the host resets them, an
     aggressive element reset, a transformed ancestor that breaks
     position:fixed for anything inside it, and a very high z-index on a fixed
     bar that the mark still has to beat. */
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.75 Georgia, serif; background: #101014; color: #eee; }
  img { display: block; max-width: 100%; }
  .chrome { position: fixed; inset: 0 auto auto 0; width: 100%; height: 56px;
            z-index: 999999999; background: #000c; backdrop-filter: blur(6px);
            display: flex; align-items: center; padding: 0 24px; }
  /* A transformed ancestor: position:fixed inside this resolves against it,
     not the viewport, so a naive host would let the mark drift when scrolled. */
  .transform-zone { transform: translateZ(0); }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
          gap: 18px; padding: 80px 24px 24px; }
  .card { margin: 0; }
  .card img { width: 100%; height: auto; border-radius: 6px; }
  .media { position: relative; }
  .overlay { position: absolute; inset: 0; opacity: 0; pointer-events: none;
             background: linear-gradient(#0006, transparent); }
  .media:hover .overlay { opacity: 1; pointer-events: auto; }
  .save { position: absolute; top: 12px; right: 12px; width: 64px; height: 40px; }
  .card figcaption { font-size: 12px; color: #9aa; padding-top: 6px; }
  body[data-layout] { background: #fff; color: #111; }
  body[data-layout] #grid { grid-template-columns: repeat(auto-fill, 220px); }
  body[data-layout] .card img { height: 260px; object-fit: cover; border-radius: 16px; }
  .more { position: absolute; bottom: 12px; right: 12px; width: 32px; height: 32px; border: 0; border-radius: 50%; }
  body[data-layout="board"] .more { display: none; }
  #detail { width: 460px; margin: 80px 24px 0; }
  #detail img { width: 100%; height: 300px; object-fit: cover; border-radius: 16px; }
  .visual-search { position: absolute; bottom: 12px; right: 12px; width: 48px; height: 48px; }
  @media (max-width: 480px) {
    body[data-layout] #grid { grid-template-columns: repeat(2, 108px); gap: 16px; padding-left: 88px; padding-right: 16px; }
    body[data-layout] .card img { height: 144px; }
    body[data-layout] .save { width: 48px; height: 32px; }
    #detail { width: 232px; margin-left: 88px; }
  }
</style>
</head>
<body>
  <div class="chrome">Host page chrome, z-index 999999999</div>
  <div id="tiny"></div>
  <div class="transform-zone"><div id="grid"></div></div>
  <script type="module" src="/dev/collector.ts"></script>
</body>
</html>
