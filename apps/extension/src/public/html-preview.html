<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body,iframe{width:100%;height:100%;margin:0;border:0}body{overflow:hidden;background:white}iframe{display:block}</style>
</head><body><iframe title="HTML document" sandbox="allow-scripts allow-forms allow-downloads" referrerpolicy="no-referrer"></iframe>
<script>
// Only the owning canvas may supply a document. Messages from generated HTML
// are ignored, and this isolated page has no Chrome extension APIs.
let currentHtml;
addEventListener('message', event => {
  if (event.source !== parent || event.data?.type !== 'galta-html-preview' || typeof event.data.html !== 'string') return;
  if (event.data.html === currentHtml) return;
  // The first base belongs to the renderer. Without it, srcdoc resolves
  // href="#section" against this extension wrapper instead of its own URL.
  // Prepending it also covers links created later by the document's scripts.
  document.querySelector('iframe').srcdoc = '<base href="about:srcdoc">' + event.data.html;
  currentHtml = event.data.html;
});

// A poster (htmlPoster.ts) loads the document once, unseen, with `capture`
// running ahead of it, and relays the markup `capture` returns. The canvas
// draws that markup as an image, so nothing in it can run.
let posterId;
addEventListener('message', event => {
  const frame = document.querySelector('iframe');
  if (event.source === parent && event.data?.type === 'galta-html-poster-request' && typeof event.data.html === 'string' && typeof event.data.id === 'string') {
    posterId = event.data.id;
    frame.srcdoc = '<base href="about:srcdoc"><script>(' + capture + ')()<\/script>' + event.data.html;
  } else if (posterId && event.source === frame.contentWindow && event.data?.type === 'galta-html-poster-markup' && typeof event.data.markup === 'string') {
    parent.postMessage({ type: 'galta-html-poster', id: posterId, markup: event.data.markup }, '*');
    posterId = undefined;
  }
});

// Runs inside the generated document. Once it has loaded and its fonts are
// in, the page as it stands becomes self-contained markup: what its scripts
// built, its canvases as pictures, its form values, and its remote images
// when their servers allow the read. Scripts, scroll position and nested
// frames are left behind.
function capture() {
  const script = document.currentScript;
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
  const within = (promise, ms) => Promise.race([promise, wait(ms)]);
  const loaded = new Promise(resolve => addEventListener('load', resolve, { once: true }));
  const read = blob => new Promise(resolve => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = () => resolve(undefined); reader.readAsDataURL(blob); });
  (async () => {
    await within(loaded, 4000);
    // Laying the page out requests the fonts its text needs, even unseen.
    document.documentElement.getBoundingClientRect();
    await within(document.fonts.ready, 1000);
    await wait(150);
    script?.remove();
    const live = document.documentElement, copy = live.cloneNode(true);
    const pairs = selector => { const twins = copy.querySelectorAll(selector); return [...live.querySelectorAll(selector)].map((element, i) => [element, twins[i]]); };
    for (const [element, twin] of pairs('canvas')) {
      try { twin.style.setProperty('background-image', `url(${element.toDataURL()})`); twin.style.setProperty('background-size', '100% 100%'); twin.style.setProperty('background-repeat', 'no-repeat'); } catch {}
    }
    for (const [element, twin] of pairs('input')) {
      if (element.type === 'checkbox' || element.type === 'radio') element.checked ? twin.setAttribute('checked', '') : twin.removeAttribute('checked');
      else if (element.type !== 'file' && element.type !== 'password') twin.setAttribute('value', element.value);
    }
    for (const [element, twin] of pairs('textarea')) twin.textContent = element.value;
    // Markup drawn as an image has no navigable links, so the browser drops
    // its link styles; keep the colour and underline the page showed.
    for (const [element, twin] of pairs('a[href]')) { const style = getComputedStyle(element); twin.style.setProperty('color', style.color); twin.style.setProperty('text-decoration', style.textDecoration); }
    for (const [element, twin] of pairs('select')) [...element.options].forEach((option, i) => option.selected ? twin.options[i]?.setAttribute('selected', '') : twin.options[i]?.removeAttribute('selected'));
    // An image cannot load anything, so remote images, style sheets and the
    // web fonts the page actually uses come along, when their servers allow
    // the read and within the time left.
    const fetched = async (url, as) => {
      const response = await fetch(url, { mode: 'cors', credentials: 'omit' }).catch(() => undefined);
      return response?.ok ? as === 'text' ? response.text().catch(() => undefined) : read(await response.blob()) : undefined;
    };
    const weights = { normal: '400', bold: '700' };
    const face = (family, weight, style, range) => [family.replace(/['"]/g, '').trim().toLowerCase(), weights[weight] ?? weight, style,
      range.toUpperCase().split(',').map(part => part.trim().replace('U+', '').split('-').map(hex => parseInt(hex, 16)).join('-')).join(',')].join('|');
    const used = new Set([...document.fonts].filter(font => font.status === 'loaded').map(font => face(font.family, font.weight, font.style, font.unicodeRange)));
    const fonts = async (css, base) => {
      const rules = css.match(/@font-face\s*{[^}]*}/g) ?? [];
      const inlined = await Promise.all(rules.map(async rule => {
        if (rule.includes('url(data:')) return rule;
        const value = name => rule.match(new RegExp(`(?:^|[;{\\s])${name}\\s*:\\s*([^;}]+)`, 'i'))?.[1].trim();
        if (!used.has(face(value('font-family') ?? '', value('font-weight') ?? '400', value('font-style') ?? 'normal', value('unicode-range') ?? 'U+0-10FFFF'))) return '';
        const sources = [...rule.matchAll(/url\(\s*(['"]?)([^'")]+)\1\s*\)\s*(?:format\(\s*['"]?([\w-]+)['"]?\s*\))?/g)].map(match => ({ url: new URL(match[2], base).href, format: match[3] ?? '' }));
        const source = sources.find(source => source.format === 'woff2') ?? sources.find(source => source.format === 'woff') ?? sources.find(source => !/\.eot\b/i.test(source.url));
        const data = source && /^https:/.test(source.url) && await fetched(source.url);
        return data ? rule.replace(/src\s*:[^;}]+;?/gi, '').replace(/}$/, `;src:url("${data}")}`) : '';
      }));
      rules.forEach((rule, i) => { css = css.replace(rule, () => inlined[i]); });
      return css;
    };
    const sheet = async (css, base) => {
      const imports = [...css.matchAll(/@import\s+(?:url\(\s*)?(['"]?)(https:[^'")\s]+)\1\s*\)?[^;]*;/g)];
      const texts = await Promise.all(imports.map(async match => { const text = await fetched(match[2], 'text'); return text ? fonts(text, match[2]) : ''; }));
      imports.forEach((match, i) => { css = css.replace(match[0], () => texts[i]); });
      return fonts(css, base);
    };
    await within(Promise.all([
      ...pairs('img').filter(([element]) => /^https:/.test(element.currentSrc)).slice(0, 24).map(async ([element, twin]) => {
        const data = await fetched(element.currentSrc);
        if (data) { twin.src = data; twin.removeAttribute('srcset'); twin.removeAttribute('sizes'); }
      }),
      ...pairs('link[rel~="stylesheet"][href]').filter(([element]) => /^https:/.test(element.href)).slice(0, 12).map(async ([element, twin]) => {
        const css = await fetched(element.href, 'text');
        if (!css) return;
        const style = document.createElement('style');
        if (element.media) style.media = element.media;
        style.textContent = await sheet(css, element.href);
        twin.replaceWith(style);
      }),
      ...[...copy.querySelectorAll('style')].map(async style => { style.textContent = await sheet(style.textContent, document.baseURI); }),
    ]), 2500);
    copy.querySelectorAll('script, noscript, picture > source').forEach(element => element.remove());
    // A document's background paints the whole viewport, from its root or
    // else its body; markup in an image has no viewport, so the root carries it.
    const clear = style => style.backgroundColor === 'rgba(0, 0, 0, 0)' && style.backgroundImage === 'none';
    const root = getComputedStyle(live), body = document.body && getComputedStyle(document.body);
    const paint = !clear(root) ? root : body && !clear(body) ? body : undefined;
    for (const name of ['background-color', 'background-image', 'background-size', 'background-position', 'background-repeat']) copy.style.setProperty(name, paint ? paint.getPropertyValue(name) : name === 'background-color' ? 'white' : '');
    copy.style.setProperty('width', `${innerWidth}px`); copy.style.setProperty('height', `${innerHeight}px`); copy.style.setProperty('overflow', 'hidden');
    parent.postMessage({ type: 'galta-html-poster-markup', markup: new XMLSerializer().serializeToString(copy) }, '*');
  })();
}
</script></body></html>
